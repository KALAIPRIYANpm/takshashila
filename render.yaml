services:
  - type: web
    name: takshashila
    runtime: docker
    region: singapore              
    plan: starter                  
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: takshashila-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MSG91_AUTH_KEY
        sync: false              
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_OTP_VAR
        value: otp

databases:
  - name: takshashila-db
    databaseName: takshashila
    region: singapore
    plan: basic-256mb              
